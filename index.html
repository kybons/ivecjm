<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Иисусе</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #f3e9dc, #d8c3a5); 
            color: #5c4a3d;
            font-family: 'Georgia', serif;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            padding: 25px;
            background: rgba(255, 250, 240, 0.85);
            border-radius: 12px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Сайт временно закрыт</h1>
        <p>Но врата Царства Небесного всегда открыты для желающих войти ими через непрестанную молитву:<br><i>«Господи, Иисусе Христе, Сыне Божий, помилуй мя грешнаго!»</i></p>
    </div>
</body>
</html>
